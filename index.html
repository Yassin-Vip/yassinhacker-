<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Yassin_Vip-File — منصة خاصة</title>
<link rel="icon" href="https://cdn.imagetourls.com/uploads/tyImg/asb9XJFJ.png" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg-0:#030503;
    --bg-1:#070c07;
    --bg-2:#0b130b;
    --panel:#0c140c;
    --panel-2:#101a10;
    --line:#1a281a;
    --line-2:#243624;
    --neon:#3bff86;
    --neon-dim:#1c7e42;
    --neon-glow:rgba(59,255,134,.35);
    --gold:#d4af37;
    --gold-dim:#8a7020;
    --danger:#ff4d6d;
    --danger-dim:#5c1a2a;
    --text:#eef7ef;
    --muted:#7d957f;
    --muted-2:#5c6f5e;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:'Cairo',system-ui,-apple-system,sans-serif;
    background:var(--bg-0);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
    font-weight:400;
    letter-spacing:.1px;
    position:relative;
  }
  a{color:var(--neon);text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;outline:none;background:none;color:inherit;transition:.2s}
  input,textarea,select{font-family:inherit;outline:none;border:none;background:none;color:inherit}
  input:disabled,textarea:disabled{opacity:.55;cursor:not-allowed}
  ::selection{background:var(--neon);color:var(--bg-0)}

  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(1000px 500px at 85% -10%, rgba(59,255,134,.08) 0%, transparent 60%),
      radial-gradient(800px 400px at -10% 110%, rgba(212,175,55,.06) 0%, transparent 55%),
      radial-gradient(1400px 700px at 50% 50%, rgba(11,19,11,.6) 0%, transparent 70%);
  }
  body::after{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(59,255,134,.025) 1px, transparent 1px),
      linear-gradient(90deg, rgba(59,255,134,.025) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:radial-gradient(ellipse at 50% 30%, #000 0%, transparent 80%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 30%, #000 0%, transparent 80%);
  }

  .app-shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}

  .topbar{
    display:flex;align-items:center;gap:14px;
    padding:12px 22px;
    background:rgba(7,12,7,.85);
    backdrop-filter:blur(14px) saturate(140%);
    -webkit-backdrop-filter:blur(14px) saturate(140%);
    border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:50;
  }
  .topbar .logo{
    width:38px;height:38px;border-radius:10px;object-fit:cover;
    border:1px solid var(--line-2);
    box-shadow:0 0 0 1px rgba(59,255,134,.15), 0 0 18px rgba(59,255,134,.12);
    flex-shrink:0;
  }
  .topbar .title{
    font-family:'Reem Kufi',sans-serif;
    font-size:17px;font-weight:700;
    background:linear-gradient(120deg, #eef7ef 0%, var(--neon) 60%, var(--gold) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    letter-spacing:.5px;
  }
  .topbar .title small{display:block;font-size:10.5px;color:var(--muted);font-weight:400;letter-spacing:2px;margin-top:1px;-webkit-text-fill-color:var(--muted)}
  .topbar .spacer{flex:1}
  .topbar .me-info{display:flex;align-items:center;gap:10px}
  .topbar .me-info .who{text-align:left;line-height:1.2}
  .topbar .me-info .who b{font-size:13px;font-weight:700}
  .topbar .me-info .who span{display:block;font-size:10.5px;color:var(--muted)}
  .topbar .me-info .av{
    width:36px;height:36px;border-radius:50%;
    background:linear-gradient(135deg, var(--neon-dim), var(--neon));
    display:grid;place-items:center;color:var(--bg-0);font-weight:900;font-size:14px;
    border:1.5px solid var(--line-2);
    box-shadow:0 0 0 2px rgba(59,255,134,.1);
  }
  .topbar .logout{
    padding:8px 14px;border-radius:8px;font-size:12.5px;font-weight:700;
    color:var(--danger);border:1px solid var(--danger-dim);
    background:rgba(255,77,109,.05);
  }
  .topbar .logout:hover{background:rgba(255,77,109,.12);border-color:var(--danger)}

  .role-badge{
    display:inline-flex;align-items:center;gap:5px;
    padding:3px 9px;border-radius:6px;font-size:10.5px;font-weight:800;letter-spacing:.3px;
    background:rgba(125,149,127,.1);color:var(--muted);border:1px solid var(--line-2);
  }
  .role-badge.owner{background:rgba(212,175,55,.1);color:var(--gold);border-color:var(--gold-dim)}
  .role-badge.admin{background:rgba(255,77,109,.08);color:var(--danger);border-color:var(--danger-dim)}
  .role-badge.dev  {background:rgba(59,255,134,.08);color:var(--neon);border-color:var(--neon-dim)}

  .layout{
    flex:1;display:grid;grid-template-columns:1fr;
    gap:0;max-width:1500px;width:100%;margin:0 auto;
  }
  @media(min-width:960px){ .layout{grid-template-columns:260px 1fr;gap:22px;padding:22px} }

  .sidebar{
    background:rgba(7,12,7,.6);
    border-bottom:1px solid var(--line);
    padding:14px;overflow-x:auto;
  }
  @media(min-width:960px){
    .sidebar{
      background:linear-gradient(180deg, rgba(12,20,12,.7), rgba(7,12,7,.7));
      border:1px solid var(--line);
      border-radius:14px;
      padding:16px;
      height:fit-content;
      position:sticky;top:82px;
      overflow-x:visible;
    }
  }
  .sidebar h3{
    font-size:10.5px;color:var(--muted-2);letter-spacing:2.5px;font-weight:700;
    text-transform:uppercase;margin-bottom:12px;padding:0 8px;
  }
  .sidebar nav{display:flex;gap:6px;flex-wrap:nowrap}
  @media(min-width:960px){ .sidebar nav{flex-direction:column;gap:4px} }
  .sidebar nav button{
    display:flex;align-items:center;gap:10px;
    padding:10px 12px;border-radius:10px;
    color:var(--muted);font-weight:600;font-size:13.5px;
    white-space:nowrap;flex-shrink:0;
    border:1px solid transparent;
    position:relative;
  }
  .sidebar nav button:hover{color:var(--text);background:rgba(59,255,134,.04)}
  .sidebar nav button.active{
    color:var(--neon);
    background:linear-gradient(90deg, rgba(59,255,134,.12), transparent 90%);
    border-color:var(--line-2);
    box-shadow:inset 2px 0 0 var(--neon);
  }
  .sidebar nav button .ic{font-size:15px;width:18px;text-align:center}

  .main{padding:18px}
  @media(min-width:960px){ .main{padding:0} }
  .page{
    background:linear-gradient(180deg, rgba(12,20,12,.7), rgba(7,12,7,.7));
    border:1px solid var(--line);
    border-radius:14px;
    padding:22px;
    min-height:520px;
    animation:fadeUp .35s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .page-head{margin-bottom:20px}
  .page-head h2{
    font-family:'Reem Kufi',sans-serif;
    font-size:20px;font-weight:700;letter-spacing:.3px;
    display:flex;align-items:center;gap:10px;
  }
  .page-head p{font-size:12.5px;color:var(--muted);margin-top:4px}

  .composer{
    background:rgba(3,5,3,.5);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    margin-bottom:20px;
  }
  .composer textarea{
    width:100%;min-height:80px;
    background:rgba(0,0,0,.3);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
    font-size:14px;resize:vertical;line-height:1.6;
    transition:.2s;
  }
  .composer textarea::placeholder{color:var(--muted-2)}
  .composer textarea:focus{border-color:var(--neon-dim);box-shadow:0 0 0 3px rgba(59,255,134,.08)}
  .composer .row{
    display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center;
  }
  .file-pick{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 12px;border-radius:9px;
    background:rgba(59,255,134,.04);
    border:1px solid var(--line-2);
    color:var(--muted);font-size:12.5px;font-weight:600;cursor:pointer;
  }
  .file-pick:hover{color:var(--neon);border-color:var(--neon-dim)}
  .file-pick input{display:none}
  .file-pick.attached{color:var(--neon);border-color:var(--neon-dim);background:rgba(59,255,134,.08)}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:11px 20px;border-radius:10px;
    font-weight:800;font-size:13.5px;letter-spacing:.3px;
    background:linear-gradient(135deg, var(--neon), #2fd173);
    color:var(--bg-0);
    box-shadow:0 4px 16px rgba(59,255,134,.2), 0 0 0 1px rgba(59,255,134,.3);
    transition:.2s;
  }
  .btn:hover{transform:translateY(-1px);box-shadow:0 6px 22px rgba(59,255,134,.32)}
  .btn:active{transform:translateY(0)}
  .btn:disabled{opacity:.5;cursor:not-allowed;transform:none}
  .btn.ghost{
    background:transparent;color:var(--neon);
    border:1px solid var(--neon-dim);box-shadow:none;
  }
  .btn.ghost:hover{background:rgba(59,255,134,.08)}
  .btn.danger{
    background:linear-gradient(135deg, #ff4d6d, #e63a5a);
    color:#fff;
    box-shadow:0 4px 16px rgba(255,77,109,.2);
  }
  .btn.small{padding:7px 12px;font-size:12px;border-radius:8px}
  .btn.full{width:100%}

  .feed{display:flex;flex-direction:column;gap:12px}
  .post{
    background:linear-gradient(180deg, rgba(16,26,16,.5), rgba(10,16,10,.5));
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px;
    transition:.2s;
  }
  .post:hover{border-color:var(--line-2)}
  .post .post-head{display:flex;gap:11px;align-items:center;margin-bottom:10px}
  .post .post-head .av{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg, var(--neon-dim), var(--neon));
    display:grid;place-items:center;color:var(--bg-0);font-weight:900;font-size:15px;
    flex-shrink:0;
    border:1px solid var(--line-2);
  }
  .post .post-head .av.owner{background:linear-gradient(135deg, var(--gold-dim), var(--gold))}
  .post .post-head .av.admin{background:linear-gradient(135deg, #7a1e2f, #e63a5a)}
  .post .post-head .meta{flex:1;min-width:0}
  .post .post-head .meta .name{
    display:flex;align-items:center;gap:8px;
    font-size:14px;font-weight:700;
  }
  .post .post-head .meta .info{font-size:11px;color:var(--muted);margin-top:2px}
  .post .body{
    font-size:14px;line-height:1.75;
    white-space:pre-wrap;word-break:break-word;
    margin-bottom:8px;color:#d8e9da;
  }
  .post .attach-img{
    max-width:100%;max-height:520px;border-radius:10px;
    border:1px solid var(--line-2);
    margin-top:8px;cursor:zoom-in;display:block;
  }
  .post .attach-file{
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 13px;border-radius:9px;
    background:rgba(59,255,134,.06);
    border:1px solid var(--neon-dim);
    color:var(--neon);font-size:12.5px;font-weight:600;
    margin-top:8px;
    transition:.2s;
  }
  .post .attach-file:hover{background:rgba(59,255,134,.12)}
  .post .post-actions{
    display:flex;gap:6px;margin-top:10px;
    padding-top:10px;border-top:1px solid var(--line);
  }
  .post .post-actions button{
    color:var(--muted);font-size:11.5px;padding:5px 10px;
    border-radius:6px;font-weight:600;
  }
  .post .post-actions button:hover{background:rgba(255,77,109,.08);color:var(--danger)}
  .post .post-actions button.edit:hover{background:rgba(59,255,134,.08);color:var(--neon)}

  .chat-shell{
    display:grid;grid-template-columns:1fr;
    gap:14px;
    height:calc(100vh - 260px);min-height:480px;
  }
  @media(min-width:900px){ .chat-shell{grid-template-columns:300px 1fr} }
  .chat-side{
    background:rgba(3,5,3,.5);
    border:1px solid var(--line);
    border-radius:12px;
    padding:10px;overflow-y:auto;
  }
  .chat-side h4{
    font-size:10.5px;color:var(--muted-2);letter-spacing:2px;
    padding:6px 10px;text-transform:uppercase;font-weight:700;margin-bottom:4px;
  }
  .chat-contact{
    display:flex;gap:11px;align-items:center;
    padding:10px;border-radius:10px;
    cursor:pointer;transition:.15s;
    border:1px solid transparent;
    margin-bottom:2px;
  }
  .chat-contact:hover{background:rgba(59,255,134,.04)}
  .chat-contact.active{
    background:linear-gradient(90deg, rgba(59,255,134,.1), transparent);
    border-color:var(--line-2);
    box-shadow:inset 2px 0 0 var(--neon);
  }
  .chat-contact .av{
    width:40px;height:40px;border-radius:11px;flex-shrink:0;
    background:linear-gradient(135deg, var(--neon-dim), var(--neon));
    display:grid;place-items:center;color:var(--bg-0);font-weight:900;font-size:15px;
    border:1px solid var(--line-2);
  }
  .chat-contact .av.owner{background:linear-gradient(135deg, var(--gold-dim), var(--gold))}
  .chat-contact .av.admin{background:linear-gradient(135deg, #7a1e2f, #e63a5a)}
  .chat-contact .info{flex:1;min-width:0}
  .chat-contact .info .n{
    display:flex;align-items:center;gap:6px;
    font-size:13.5px;font-weight:700;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chat-contact .info .p{
    font-size:11px;color:var(--muted);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    margin-top:2px;
  }
  .chat-contact .time{font-size:10px;color:var(--muted-2);flex-shrink:0}

  .chat-room{
    background:rgba(3,5,3,.4);
    border:1px solid var(--line);
    border-radius:12px;
    display:flex;flex-direction:column;overflow:hidden;
  }
  .chat-header{
    display:flex;gap:11px;align-items:center;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
    background:rgba(16,26,16,.4);
  }
  .chat-header .av{
    width:38px;height:38px;border-radius:11px;
    background:linear-gradient(135deg, var(--neon-dim), var(--neon));
    display:grid;place-items:center;color:var(--bg-0);font-weight:900;font-size:15px;
  }
  .chat-header .av.owner{background:linear-gradient(135deg, var(--gold-dim), var(--gold))}
  .chat-header .av.admin{background:linear-gradient(135deg, #7a1e2f, #e63a5a)}
  .chat-header .who h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .chat-header .who span{font-size:11px;color:var(--muted);margin-top:2px;display:block}

  .chat-body{
    flex:1;overflow-y:auto;padding:18px;
    display:flex;flex-direction:column;gap:10px;
  }
  .bubble{
    max-width:72%;padding:10px 14px;
    border-radius:14px;
    font-size:13.5px;line-height:1.6;
    position:relative;word-break:break-word;
    animation:fadeUp .2s ease both;
  }
  .bubble .txt{white-space:pre-wrap}
  .bubble.mine{
    align-self:flex-end;
    background:linear-gradient(135deg, var(--neon), #26b862);
    color:var(--bg-0);
    border-bottom-right-radius:4px;
    font-weight:500;
  }
  .bubble.theirs{
    align-self:flex-start;
    background:rgba(22,36,22,.9);
    color:var(--text);
    border:1px solid var(--line-2);
    border-bottom-left-radius:4px;
  }
  .bubble img{max-width:100%;border-radius:8px;margin-top:7px;cursor:zoom-in;display:block}
  .bubble .f-link{
    display:inline-flex;align-items:center;gap:6px;
    padding:6px 10px;border-radius:7px;
    background:rgba(0,0,0,.25);color:inherit;
    font-size:12.5px;font-weight:600;margin-top:6px;
  }
  .bubble .stamp{
    font-size:9.5px;opacity:.6;margin-top:5px;display:block;text-align:right;
  }
  .bubble .bub-acts{
    display:flex;gap:3px;margin-top:5px;
    opacity:0;transition:.2s;
  }
  .bubble:hover .bub-acts{opacity:1}
  .bubble .bub-acts button{
    color:inherit;opacity:.7;
    padding:2px 7px;border-radius:5px;font-size:11px;
  }
  .bubble .bub-acts button:hover{opacity:1;background:rgba(0,0,0,.2)}

  .chat-compose{
    display:flex;gap:8px;padding:12px;
    border-top:1px solid var(--line);
    background:rgba(16,26,16,.4);
    align-items:flex-end;
  }
  .chat-compose .icon-btn{
    width:42px;height:42px;flex-shrink:0;
    border-radius:11px;
    background:rgba(59,255,134,.04);
    border:1px solid var(--line-2);
    display:grid;place-items:center;
    color:var(--muted);font-size:17px;
    cursor:pointer;
  }
  .chat-compose .icon-btn:hover{color:var(--neon);border-color:var(--neon-dim)}
  .chat-compose .icon-btn.send{
    background:linear-gradient(135deg, var(--neon), #2fd173);
    color:var(--bg-0);border:none;
  }
  .chat-compose .icon-btn.send:hover{filter:brightness(1.1)}
  .chat-compose .icon-btn input{display:none}
  .chat-compose textarea{
    flex:1;
    background:rgba(0,0,0,.3);
    color:var(--text);
    border:1px solid var(--line);
    border-radius:11px;
    padding:11px 14px;font-size:14px;
    resize:none;max-height:130px;min-height:42px;
    line-height:1.5;
  }
  .chat-compose textarea:focus{border-color:var(--neon-dim);box-shadow:0 0 0 3px rgba(59,255,134,.06)}
  .empty-chat{
    flex:1;display:grid;place-items:center;
    color:var(--muted-2);font-size:13.5px;
    text-align:center;padding:30px;
  }
  .empty-chat .big{font-size:42px;margin-bottom:12px;opacity:.4}

  .user-list{display:flex;flex-direction:column;gap:8px}
  .user-item{
    display:flex;align-items:center;gap:12px;
    padding:12px 14px;
    background:rgba(3,5,3,.5);
    border:1px solid var(--line);
    border-radius:11px;
    transition:.2s;
  }
  .user-item:hover{border-color:var(--line-2);background:rgba(16,26,16,.4)}
  .user-item .av{
    width:40px;height:40px;border-radius:11px;
    background:linear-gradient(135deg, var(--neon-dim), var(--neon));
    display:grid;place-items:center;color:var(--bg-0);font-weight:900;font-size:15px;
    flex-shrink:0;
  }
  .user-item .av.owner{background:linear-gradient(135deg, var(--gold-dim), var(--gold))}
  .user-item .av.admin{background:linear-gradient(135deg, #7a1e2f, #e63a5a)}
  .user-item .u-info{flex:1;min-width:0}
  .user-item .u-info .n{
    display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:13.5px;font-weight:700;
  }
  .user-item .u-info .e{font-size:11.5px;color:var(--muted);margin-top:2px}
  .user-item .u-info .perms{font-size:11px;color:var(--muted-2);margin-top:3px}

  .modal{
    position:fixed;inset:0;z-index:200;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    display:none;place-items:center;padding:20px;
  }
  .modal.open{display:grid;animation:fadeUp .25s ease both}
  .modal-card{
    width:min(560px,96vw);
    max-height:90vh;overflow-y:auto;
    background:linear-gradient(180deg, #0c140c, #070c07);
    border:1px solid var(--line-2);
    border-radius:16px;
    padding:24px;
    box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 0 1px rgba(59,255,134,.06);
  }
  .modal-card h3{font-family:'Reem Kufi',sans-serif;font-size:18px;margin-bottom:5px}
  .modal-card .sub{font-size:12px;color:var(--muted);margin-bottom:18px}
  .perm-row{
    display:flex;align-items:center;gap:11px;
    padding:11px 13px;border-radius:10px;
    background:rgba(3,5,3,.5);border:1px solid var(--line);
    margin-bottom:6px;cursor:pointer;transition:.15s;
  }
  .perm-row:hover{border-color:var(--neon-dim);background:rgba(59,255,134,.03)}
  .perm-row input[type=checkbox]{

/* ============ UPLOAD ============ */
async function uploadImage(file){
  const fd = new FormData();
  fd.append("image", file);
  const res = await fetch("https://api.imgbb.com/1/upload?key=" + IMGBB_KEY, { method:"POST", body:fd });
  const j = await res.json();
  if(!j.success) throw new Error("ImgBB: " + (j.error?.message || "failed"));
  return { url: j.data.url, thumb: j.data.thumb?.url || j.data.url };
}

async function uploadFile(file){
  const fd = new FormData();
  fd.append("file", file);
  const res = await fetch("https://tmpfiles.org/api/v1/upload", { method:"POST", body:fd });
  const j = await res.json();
  if(!j.data?.url) throw new Error("Upload failed");
  const directUrl = j.data.url.replace("tmpfiles.org/", "tmpfiles.org/dl/");
  return { url: directUrl, name: file.name, size: file.size };
}

}

  let image=null, fileData=null;

    if(fileFile) fileData = await uploadFile(fileFile);
  }catch(e){
    status.className = "auth-msg err"; status.textContent = "فشل الرفع: " + e.message;
    return;
  }

  await push(ref(db,"feed"), {
    category, text, image, file:fileData,
    from: { uid: me.uid, name: me.name, email: me.email, role: me.role, isOwner: me.isOwner },
    createdAt: Date.now()
  });

  document.getElementById(textId).value = "";
  imgEl.value = ""; fileEl.value = "";
  if(imgLbl) document.getElementById(imgLbl).classList.remove("attached");
  if(fileLbl) document.getElementById(fileLbl).classList.remove("attached");
  status.className = "auth-msg ok"; status.textContent = "تم الإرسال";
  toast("تم النشر");
  setTimeout(()=>{ status.textContent = ""; }, 2000);
}

function bindComposerAttach(id){
  const imgEl = document.getElementById(id+"_img");
  const fileEl = document.getElementById(id+"_file");
  const imgLbl = document.getElementById(id+"_imgLbl");
  const fileLbl = document.getElementById(id+"_fileLbl");
  if(imgEl) imgEl.onchange = () => imgLbl.classList.toggle("attached", !!imgEl.files[0]);
  if(fileEl) fileEl.onchange = () => fileLbl.classList.toggle("attached", !!fileEl.files[0]);
}

      <p>الرسائل العامة لكل أعضاء المنصة.</p>

function postHTML(p){
  const r = roleInfo(p.from);
  const canDel = me.isOwner || hasPerm(me,"deleteAnyPost") || p.from?.uid === me.uid;
  const canEdit = p.from?.uid === me.uid;
  const avClass = p.from?.isOwner ? "owner" : (r.cls === "admin" ? "admin" : "");
  return `
    <div class="post" data-key="${p.key}">
      <div class="post-head">
        <div class="av ${avClass}">${esc(initial(p.from?.name))}</div>
        <div class="meta">
          <div class="name">${esc(p.from?.name || "؟")} ${roleBadge(p.from)}</div>
          <div class="info">${fmtTime(p.createdAt)}</div>
        </div>
      </div>
      ${p.text ? `<div class="body" data-body>${esc(p.text)}</div>` : ""}
      ${p.image ? `<img class="attach-img" src="${esc(p.image.url)}" />` : ""}
      ${p.file ? `<a class="attach-file" href="${esc(p.file.url)}" target="_blank" rel="noopener">📎 ${esc(p.file.name)} · ${(p.file.size/1024).toFixed(0)} KB</a>` : ""}
      ${(canEdit || canDel) ? `
        <div class="post-actions">
          ${canEdit ? `<button class="edit" data-edit>✏️ تعديل</button>` : ""}
          ${canDel ? `<button data-del>🗑 حذف</button>` : ""}
        </div>` : ""}
    </div>`;
}

function bindPostActions(container){
  container.querySelectorAll("img.attach-img").forEach(img => {
    img.onclick = () => {
      document.getElementById("lightImg").src = img.src;
      document.getElementById("lightbox").classList.add("open");
    };
  });
  container.querySelectorAll(".post").forEach(post => {
    const key = post.dataset.key;
    const delBtn = post.querySelector("[data-del]");
    const editBtn = post.querySelector("[data-edit]");
    if(delBtn) delBtn.onclick = async () => {
      if(!confirm("هل أنت متأكد من حذف هذا المنشور؟")) return;
      await remove(ref(db,"feed/"+key));
      toast("تم الحذف");
    };
    if(editBtn) editBtn.onclick = () => {
      const body = post.querySelector("[data-body]");
      if(!body) return;
      if(editingPostKey === key){
        const newText = body.textContent.trim();
        update(ref(db,"feed/"+key), { text:newText }).then(()=>{ toast("تم التعديل"); editingPostKey = null; });
      } else {
        editingPostKey = key;
        body.setAttribute("contenteditable","true");
        body.style.outline = "1px dashed var(--neon)";
        body.style.padding = "10px";
        body.style.borderRadius = "8px";
        body.focus();
        editBtn.textContent = "💾 حفظ";
      }
    };
  });
}

async function renderChats(){
  const c = document.getElementById("content");
  c.innerHTML = `
    <div class="page-head">
      <h2>💬 المحادثات</h2>
      <p>تواصل خاص — كل رسالة محفوظة.</p>
    </div>
    <div class="chat-shell">
      <div class="chat-side" id="chatSide"></div>
      <div class="chat-room" id="chatRoom">
        <div class="empty-chat"><div><div class="big">💬</div><div>اختر محادثة للبدء</div></div></div>
      </div>
    </div>
  `;

  const usnap = await get(ref(db,"users"));
  allUsers = {};
  if(usnap.exists()) usnap.forEach(ch => allUsers[ch.key] = ch.val());

  const side = document.getElementById("chatSide");
  const contacts = [];

  if(me.isOwner){
    Object.values(allUsers).forEach(u => { if(u.uid !== me.uid) contacts.push(u); });
  } else {
    const lastSnap = await get(ref(db,"chatsByUser/"+me.uid));
    const existing = {};
    if(lastSnap.exists()) lastSnap.forEach(ch => existing[ch.key] = true);

    Object.values(allUsers).forEach(u => {
      if(u.uid === me.uid) return;
      const isOwnerUser = u.role === "owner" || isOwner(u.email);
      const canReceive = isOwnerUser || (u.perms && u.perms.receiveUserMsgs);
      if(canReceive || existing[u.uid]) contacts.push(u);
    });
  }

  if(!contacts.length){
    side.innerHTML = `<div class="empty-state"><div class="big">💬</div>لا توجد محادثات متاحة</div>`;
    return;
  }

  const lastSnap = await get(ref(db,"chatsByUser/"+me.uid));
  const lastMap = {};
  if(lastSnap.exists()) lastSnap.forEach(ch => lastMap[ch.key] = ch.val());
  contacts.sort((a,b) => (lastMap[b.uid]?.lastAt||0) - (lastMap[a.uid]?.lastAt||0));

  side.innerHTML = `<h4>جهات الاتصال</h4>` + contacts.map(u => {
    const r = roleInfo(u);
    const avClass = u.isOwner ? "owner" : (r.cls === "admin" ? "admin" : "");
    const last = lastMap[u.uid]?.lastText || "لا توجد رسائل";
    const lastAt = lastMap[u.uid]?.lastAt ? fmtTime(lastMap[u.uid].lastAt) : "";
    return `
      <div class="chat-contact" data-uid="${u.uid}" onclick="openChat('${u.uid}')">
        <div class="av ${avClass}">${esc(initial(u.name))}</div>
        <div class="info">
          <div class="n">${esc(u.name)}</div>
          <div class="p">${r.icon} ${esc(last)}</div>
        </div>
        <div class="time">${lastAt}</div>
      </div>`;
  }).join("");
}

window.openChat = async uid => {
  activeChatUid = uid;
  document.querySelectorAll(".chat-contact").forEach(el => el.classList.toggle("active", el.dataset.uid===uid));
  const target = allUsers[uid];
  if(!target) return;
  const r = roleInfo(target);
  const targetIsOwner = target.isOwner || target.role === "owner" || isOwner(target.email);
  const canSend = me.isOwner || hasPerm(me,"replyChats") || targetIsOwner;
  const avClass = targetIsOwner ? "owner" : (r.cls === "admin" ? "admin" : "");

  const room = document.getElementById("chatRoom");
  room.innerHTML = `
    <div class="chat-header">
      <div class="av ${avClass}">${esc(initial(target.name))}</div>
      <div class="who">
        <h3>${esc(target.name)} ${roleBadge({...target, isOwner: targetIsOwner})}</h3>
        <span>${esc(target.email)}</span>
      </div>
    </div>
    <div class="chat-body" id="chatBody"></div>
    ${canSend ? `
    <div class="chat-compose">
      <label class="icon-btn" id="ci_imgLbl">🖼️<input type="file" accept="image/*" id="ci_img" /></label>
      <label class="icon-btn" id="ci_fileLbl">📎<input type="file" id="ci_file" /></label>
      <textarea id="ci_text" placeholder="اكتب رسالة..." rows="1"></textarea>
      <button class="icon-btn send" id="ci_send">➤</button>
    </div>` : ``}
  `;

  if(canSend){
    const imgEl = document.getElementById("ci_img");
    const fileEl = document.getElementById("ci_file");
    imgEl.onchange = () => document.getElementById("ci_imgLbl").style.color = imgEl.files[0] ? "var(--neon)" : "";
    fileEl.onchange = () => document.getElementById("ci_fileLbl").style.color = fileEl.files[0] ? "var(--neon)" : "";
    document.getElementById("ci_send").onclick = () => sendChat(target);
    const tEl = document.getElementById("ci_text");
    tEl.addEventListener("keydown", e => {
      if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(target); }
    });
    tEl.addEventListener("input", () => {
      tEl.style.height = "auto";
      tEl.style.height = Math.min(tEl.scrollHeight, 130) + "px";
    });
  }

  if(unsubChatRoom){ unsubChatRoom(); unsubChatRoom=null; }
  const key = chatKey(me.uid, uid);
  unsubChatRoom = onValue(ref(db,"chats/"+key+"/messages"), snap => {
    const body = document.getElementById("chatBody");
    if(!snap.exists()){
      body.innerHTML = `<div class="empty-chat"><div><div class="big">✨</div>لا توجد رسائل — ابدأ الحديث</div></div>`;
      return;
    }
    const msgs = [];
    snap.forEach(ch => msgs.push({ key: ch.key, ...ch.val() }));
    msgs.sort((a,b)=>a.createdAt-b.createdAt);
    body.innerHTML = msgs.map(m => bubbleHTML(m,key)).join("");
    body.scrollTop = body.scrollHeight;
    body.querySelectorAll("img").forEach(img => {
      img.onclick = () => {
        document.getElementById("lightImg").src = img.src;
        document.getElementById("lightbox").classList.add("open");
      };
    });
    body.querySelectorAll("[data-delmsg]").forEach(b => {
      b.onclick = async () => {
        if(!confirm("حذف الرسالة؟")) return;
        await remove(ref(db,"chats/"+key+"/messages/"+b.dataset.delmsg));
      };
    });
    body.querySelectorAll("[data-editmsg]").forEach(b => {
      b.onclick = () => startEditMsg(key, b.dataset.editmsg);
    });
  });
};

function bubbleHTML(m, chatKeyStr){
  const mine = m.from?.uid === me.uid;
  const canDel = mine || me.isOwner || hasPerm(me,"deleteAnyMessage");
  const canEdit = mine;
  return `
    <div class="bubble ${mine ? "mine" : "theirs"}">
      ${m.text ? `<div class="txt">${esc(m.text)}</div>` : ""}
      ${m.image ? `<img src="${esc(m.image.url)}" />` : ""}
      ${m.file ? `<a class="f-link" href="${esc(m.file.url)}" target="_blank" rel="noopener">📎 ${esc(m.file.name)}</a>` : ""}
      <span class="stamp">${fmtTime(m.createdAt)}</span>
      ${(canEdit || canDel) ? `
        <div class="bub-acts">
          ${canEdit ? `<button data-editmsg="${m.key}">✏️</button>` : ""}
          ${canDel ? `<button data-delmsg="${m.key}">🗑</button>` : ""}
        </div>` : ""}
    </div>`;
}

async function startEditMsg(chatKeyStr, msgKey){
  const cur = prompt("عدّل الرسالة:");
  if(cur === null) return;
  await update(ref(db,"chats/"+chatKeyStr+"/messages/"+msgKey), { text: cur.trim() });
  toast("تم التعديل");
}

async function sendChat(target){
  const textEl = document.getElementById("ci_text");
  const imgEl = document.getElementById("ci_img");
  const fileEl = document.getElementById("ci_file");
  const text = textEl.value.trim();
  const imgFile = imgEl.files[0], fileFile = fileEl.files[0];
  if(!text && !imgFile && !fileFile) return;

  let image=null, fileData=null;
  try{
    if(imgFile) image = await uploadImage(imgFile);
    if(fileFile) fileData = await uploadFile(fileFile);
  }catch(e){ toast("فشل الرفع: "+e.message, true); return; }

  const key = chatKey(me.uid, target.uid);
  const msg = {
    text, image, file:fileData,
    from:{ uid: me.uid, name: me.name, email: me.email, role: me.role, isOwner: me.isOwner },
    createdAt: Date.now()
  };
  await push(ref(db,"chats/"+key+"/messages"), msg);

  const preview = text || (image ? "[صورة]" : "[ملف]");
  await update(ref(db,"chatsByUser/"+me.uid+"/"+target.uid), { lastText: preview, lastAt: Date.now(), otherUid: target.uid });
  await update(ref(db,"chatsByUser/"+target.uid+"/"+me.uid), { lastText: preview, lastAt: Date.now(), otherUid: me.uid });

  textEl.value = "";
  imgEl.value = ""; fileEl.value = "";
  document.getElementById("ci_imgLbl").style.color = "";
  document.getElementById("ci_fileLbl").style.color = "";
  textEl.style.height = "auto";
}

const chatKey = (a,b) => [a,b].sort().join("__");

async function renderAdmin(){
  const c = document.getElementById("content");
  c.innerHTML = `
    <div class="page-head">
      <h2>🛡️ الإدارة</h2>
      <p>إدارة الأعضاء وتخصيص صلاحياتهم بشكل فردي.</p>
    </div>
    <div class="user-list" id="userList"></div>
  `;
  const snap = await get(ref(db,"users"));
  const list = document.getElementById("userList");
  if(!snap.exists()){ list.innerHTML = emptyState("لا يوجد أعضاء"); return; }
  const users = [];
  snap.forEach(ch => users.push({ key: ch.key, ...ch.val() }));
  users.sort((a,b) => {
    const order = { owner:0, admin:1, dev:2, user:3 };
    const oa = order[a.role] ?? 9, ob = order[b.role] ?? 9;
    if(oa !== ob) return oa - ob;
    return (b.createdAt||0) - (a.createdAt||0);
  });
  list.innerHTML = users.map(u => {
    const r = roleInfo(u);
    const avClass = u.isOwner ? "owner" : (r.cls === "admin" ? "admin" : "");
    const permCount = u.isOwner ? PERMS.length : Object.values(u.perms||{}).filter(Boolean).length;
    const canEdit = me.isOwner || hasPerm(me,"manageUsers");
    return `
      <div class="user-item">
        <div class="av ${avClass}">${esc(initial(u.name))}</div>
        <div class="u-info">
          <div class="n">${esc(u.name)} ${roleBadge(u)}</div>
          <div class="e">${esc(u.email)}</div>
          <div class="perms">${permCount} صلاحية مُفعّلة</div>
        </div>
        ${canEdit ? `<button class="btn ghost small" onclick="openPermModal('${u.uid}')">⚙️ الصلاحيات</button>` : ""}
      </div>`;
  }).join("");
}

window.openPermModal = async uid => {
  permTargetUid = uid;
  const u = allUsers[uid] || (await get(ref(db,"users/"+uid))).val();
  if(!u) return;
  allUsers[uid] = u;
  document.getElementById("pmTitle").textContent = "صلاحيات: " + u.name;
  document.getElementById("pmSub").textContent = u.email;

  let body = `
    <div class="field">
      <label>الرتبة الأساسية</label>
      <select id="pmRole">
        <option value="user"  ${u.role==="user"?"selected":""}>عضو</option>
        <option value="admin" ${u.role==="admin"?"selected":""}>أدمن</option>
        <option value="dev"   ${u.role==="dev"?"selected":""}>مطوّر مساعد</option>
      </select>
    </div>
    <div style="margin:18px 0 10px;font-size:11px;color:var(--muted);letter-spacing:2px;font-weight:700">الصلاحيات التفصيلية</div>
  `;
  PERMS.forEach(p => {
    const checked = u.perms?.[p.key] ? "checked" : "";
    body += `
      <label class="perm-row">
        <input type="checkbox" data-perm="${p.key}" ${checked} />
        <div class="ptxt">
          <b>${p.label}</b>
          <small>${p.desc}</small>
        </div>
      </label>`;
  });
  document.getElementById("pmBody").innerHTML = body;
  document.getElementById("permModal").classList.add("open");
};

window.closePermModal = () => {
  document.getElementById("permModal").classList.remove("open");
  permTargetUid = null;
};

window.savePerms = async () => {
  if(!permTargetUid) return;
  const role = document.getElementById("pmRole").value;
  const perms = {};
  document.querySelectorAll("#pmBody input[data-perm]").forEach(cb => {
    perms[cb.dataset.perm] = cb.checked;
  });
  await update(ref(db,"users/"+permTargetUid), { role, perms });
  toast("تم حفظ الصلاحيات");
  closePermModal();
  renderAdmin();
};

function emptyState(msg){
  return `<div class="empty-state"><div class="big">📭</div>${esc(msg)}</div>`;
}
